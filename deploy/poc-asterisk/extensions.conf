[globals]
POC_OPENAI_WORKFLOW_ID=REPLACE_ME
POC_GEMINI_WORKFLOW_ID=REPLACE_ME
POC_CASCADE_WORKFLOW_ID=REPLACE_ME
POC_STASIS_APP=dograh
POC_RECORDING_DIR=/srv/data/apps/ai-receptionist-poc/recordings

[poc-inbound]
exten => s,1,Answer()
 same => n,Set(POC_UNAVAILABLE=0)
 ; No 'b' option: recording starts now and includes the IVR as well as AI/human audio.
 same => n,MixMonitor(${POC_RECORDING_DIR}/${UNIQUEID}.wav)
 same => n,Set(POC_TRY=1)
 same => n(menu),Read(POC_OPTION,poc-menu,1,,1,8)
 same => n,GotoIf($["${READSTATUS}"="OK"]?selected:noinput)
 same => n(selected),GotoIf($["${POC_OPTION}"="1"]?openai)
 same => n,GotoIf($["${POC_OPTION}"="2"]?gemini)
 same => n,GotoIf($["${POC_OPTION}"="3"]?cascade)
 same => n,GotoIf($["${POC_OPTION}"="4"]?human)
 same => n,Playback(poc-invalid)
 same => n,Goto(retry)
 same => n(noinput),Playback(poc-noinput)
 same => n(retry),Set(POC_TRY=$[${POC_TRY}+1])
 same => n,GotoIf($[${POC_TRY}<=2]?menu:goodbye)
 same => n(openai),Stasis(${POC_STASIS_APP},direction=inbound,poc_engine=openai_realtime,workflow_id=${POC_OPENAI_WORKFLOW_ID},asterisk_call_id=${UNIQUEID})
 same => n,GotoIf($["${POC_UNAVAILABLE}"="1"]?unavailable:goodbye)
 same => n(gemini),Stasis(${POC_STASIS_APP},direction=inbound,poc_engine=gemini_live,workflow_id=${POC_GEMINI_WORKFLOW_ID},asterisk_call_id=${UNIQUEID})
 same => n,GotoIf($["${POC_UNAVAILABLE}"="1"]?unavailable:goodbye)
 same => n(cascade),Stasis(${POC_STASIS_APP},direction=inbound,poc_engine=google_cascade,workflow_id=${POC_CASCADE_WORKFLOW_ID},asterisk_call_id=${UNIQUEID})
 same => n,GotoIf($["${POC_UNAVAILABLE}"="1"]?unavailable:goodbye)
 same => n(human),Dial(PJSIP/anurag,30)
 same => n,Goto(goodbye)
 same => n(unavailable),Playback(poc-unavailable)
 same => n(goodbye),Playback(poc-goodbye)
 same => n,StopMixMonitor()
 same => n,Hangup()

; Point the inbound mobile trunk at this context.
exten => _X.,1,Goto(s,1)
